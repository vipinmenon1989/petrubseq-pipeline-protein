[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "petrubseq-pipeline-protein"
version = "0.2.0"
description = "Lightweight, config-driven processing pipeline for Perturb-CITE-seq (CRISPR + scRNA-seq + ADT protein) datasets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vipin Menon" }]
keywords = ["perturb-seq", "cite-seq", "crispr", "single-cell", "scanpy", "adt"]

# Runtime dependencies are intentionally minimal; environment.yml is the
# recommended way to create the full conda environment (petrubseq-protein).
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "scanpy>=1.10",
    "anndata>=0.10",
    "h5py>=3.8",
    "umap-learn>=0.5",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "tqdm>=4.60",
    "psutil>=5.9",
    "jinja2>=3.1",
    "markupsafe>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
petrubseq-protein = "petrubseq_protein.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
petrubseq_protein = ["reporting/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["results", "scratch", ".git", ".pytest_cache", "expression", "other", "documentation", "metadata", "cluster"]
