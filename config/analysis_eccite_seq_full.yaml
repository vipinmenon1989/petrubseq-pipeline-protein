# PRODUCTION ANALYSIS CONFIG (canonical location: config/; not the public demo): the full
# pooled Papalexi ECCITE-seq screen (GSE153056, GSM4633614-GSM4633618), every HTO singlet
# (17,473 of 20,729 deposited cells; all IFN-gamma stimulated, no unstimulated condition), prepared with
#   python demo/prepare_papalexi_demo.py --source ${DATA_ROOT}/ECCITE-seq --output ${DATA_ROOT}/analysis/papalexi_eccite_full --n-cells 17473 --min-per-stratum 1
# (n-cells equals the number of eligible singlets, so nothing is sampled).
# Settings follow config/demo_papalexi.yaml except: 50 RNA PCs (default), n_jobs 8.
# Output: ${RESULTS_ROOT}/analysis/ECCITE-seq (results/demo/papalexi_eccite is the demo and is never overwritten).
run:
  name: eccite_seq_full

dataset:
  name: ECCITE-seq_full
  input_dir: ${DATA_ROOT}/analysis/papalexi_eccite_full   # all 17,473 HTO singlets of the pooled screen (prepare_papalexi_demo.py, no downsampling)
  description: >
    Papalexi et al. 2021 (Nat Genet 53:322) pooled ECCITE-seq CRISPR screen in
    IFN-gamma stimulated THP-1 cells: RNA + 4 ADTs (CD86, PD-L1, PD-L2, CD366)
    + 111 sgRNAs (25 gene targets, non-targeting and eGFP controls). Full pooled
    screen, every HTO singlet; raw UMI counts for every modality.

inputs:
  multiplexed:
    format: mtx
    path: filtered_feature_bc_matrix
    feature_types:
      rna: [Gene Expression]
      protein: [Antibody Capture]        # raw ADT counts -> CLR + count-based QC
      guide: [CRISPR Guide Capture]      # -> obsm['guide_counts'] + guide calling
    var_names: id                        # feature IDs are the gene symbols (unique)
  protein:
    required: true                       # satisfied by the raw ADT counts (no normalized matrix exists)
  metadata:
    file: cells.csv                      # per-cell metadata from the preparation script (lane, HTO demultiplexing)
    format: auto

columns:
  cell_id: cell
  condition: stimulation                 # constant 'IFNg': every hashed sample with signal is a 'tx' sample
  sample: hto_sample                     # HTO label as deposited (replicate naming is ambiguous; see the audit)
  lane: lane                             # 10x lane from the barcode prefix l1-l8
  batch: lane_group                      # lanes 1-4 vs 5-8 (different HTO barcode sets)
  rna_total_counts: null                 # raw counts: library size is computed
  keep: [hto_class, hto_top_count, sampling_stratum_target]

perturbation:
  guide_target_regex: "^(?P<target>.+?)g(?P<index>\\d+)$"   # PDL1g1 -> PDL1, NTg5 -> NT
  guide_target_table: guide_targets.csv                    # explicit mapping written by the preparation script
  control_classes:
    non_targeting: ["^NT$"]
    transgene: ["^eGFP$"]                # eGFP-targeting guide: control for a non-expressed transgene
  min_cells_per_guide: 10
  min_cells_per_target: 10
  assignment:
    source: auto                         # only guide counts exist -> guide_counts
    method: dominant                     # reference rule: top >= 3 UMIs and > 2 x runner-up; else ambiguous/unassigned
    min_umi: 3
    dominance_ratio: 2.0
    max_second_umi: -1
    detection_min_umi: 3

alignment:
  required: [rna, protein, metadata]     # 'protein' is satisfied by the ADT counts

rna:
  input_state: raw_counts                # verified integer UMI counts (audit)
  n_pcs: 50                              # default

protein:
  normalization: auto                    # -> clr (per-protein across cells)
  extra_representations: []
  isotype_patterns: ["IgG"]              # no isotype control exists in this 4-antibody panel (documented)
  feature_table: antibodies.csv          # antibody_name / protein_name / gene_symbol; clone not deposited
  n_pcs: 3                               # 4 antibodies -> at most 3 informative PCs

umap:
  min_features: 3                        # allow the protein UMAP on the 4-antibody panel (default 5)
  color_by: [perturbation_class, hto_sample]

qc:
  prefilter: {enabled: true, min_genes_per_cell: 200, min_cells_per_gene: 3}   # public defaults
  filter:
    enabled: true
    rna: {min_genes: 1000, max_pct_mt: 20.0, min_cells_per_gene: 3}          # reference defaults (perturbseq-pipeline qc)
    perturbation: {cells: all}

report:
  title: "Papalexi ECCITE-seq demo - Perturb-CITE-seq preprocessing report"

compute:
  n_jobs: 8
  seed: 0

output:
  dir: ${RESULTS_ROOT}/analysis/ECCITE-seq
  h5ad_name: eccite_seq_full_processed.h5ad

# Perturbation analyses (on by default, as in the reference pipeline): perturbation
# strength, modules / programs, PS, lochNESS, plus the protein extension.
# Methods and references: docs/PERTURBATION_EFFECTS.md.
analysis:
  perturbation_effects:
    enabled: true
    control_classes: [non_targeting]     # the NT guides; eGFP (transgene) cells are neither perturbed nor control
    target_gene_map:
      PDL1: CD274                        # dataset label -> RNA gene symbol (every other target label is its gene symbol)
    top_n_report: 12
    ps:
      top_n_genes: 100                   # reference defaults (PS_python / pertps)
      scale_factor: 3.0
      ps_threshold: 0.5
      min_cells_per_target: 10
    lochness:
      n_neighbors: 300                   # reference default (k = min(300, n - 1); no fraction cap)
      n_pcs: 20
      n_permutations: 0                  # reference has no permutation null; > 0 adds the seeded null as an extension
    modules:
      min_cells_per_perturbation: 20     # reference default: targets with >= 20 single-guide cells
      n_programs: 4                      # reference default
      n_modules: 9                       # reference default
      gene_selection: cluster_markers    # reference panel: union of the top 100 Leiden markers per cluster
      log2fc_pseudocount: 1.0e-9         # reference pseudocount
      min_pct_cells_expressing: 0.0      # reference: no detection filter
    protein:
      representation: protein            # CLR of the ADT counts (never the counts themselves)
      min_cells_per_target: 10
    concordance:
      min_cells: 20
    # Perturbation distance vs control and the pairwise distance space (reference stages
    # 10-11; off by default in the reference, enabled here for the demo). Energy distance in
    # X_pca, seeded 1000-permutation DistanceTest, BH-FDR; min_cells 30 (reference) leaves the
    # 21 largest targets. docs/PERTURBATION_DISTANCE.md.
    distance:
      enabled: true
      n_permutations: 1000               # reference default
      min_cells: 30                      # reference default
      random_seed: 123                   # reference default
    distance_space:
      enabled: true
      n_modules: null                    # reference rule: max(2, min(9, K // 4)) -> 5 modules for 21 targets
    master_table:
      enabled: true                      # tables/master_perturbation_table.csv (+ the protein companion)
  # Leiden cell states on the RNA neighbour graph and perturbation x cluster
  # enrichment (reference stages; on by default). docs/CELL_STATES.md.
  clustering:
    enabled: true
    key: leiden
    resolution: 1.0                      # reference default; not tuned for this dataset
    n_iterations: 2                      # reference default
    enrichment:
      controls: [ntc, other]             # both reference arms are computed and reported
      primary_control: other             # reference default: the arm that drives significance and the figures
      control_classes: [non_targeting]   # which control classes form the ntc arm
      min_cells_per_target: 10
      min_cells_per_cluster: 20
      stratify_by: sample                # the 3 hashed samples: adds a CMH test beside the Fisher test
      n_permutations: 1000
