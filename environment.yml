# petrubseq-pipeline-protein conda environment
#
# Create / activate:
#   conda env create -f environment.yml
#   conda activate petrubseq-protein
#   pip install -e .
#
# Deliberately light: no harmony, seaborn or GPU stacks (jinja2 only for
# report.html). igraph provides the Leiden clustering of the optional cell-state
# analysis (scanpy.tl.leiden, igraph backend); statsmodels (a scanpy dependency)
# provides the optional Cochran-Mantel-Haenszel test. Add packages here only when
# a stage needs them.
name: petrubseq-protein
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pip
  # core numerics
  - numpy>=1.26
  - pandas>=2.0
  - scipy>=1.10
  - scikit-learn>=1.3
  # single-cell stack
  - scanpy>=1.10
  - anndata>=0.10
  - h5py>=3.8
  - umap-learn>=0.5
  - python-igraph>=0.10    # Leiden clustering (analysis.clustering)
  # plotting
  - matplotlib>=3.7
  # config / utilities
  - pyyaml>=6.0
  - tqdm>=4.60
  - psutil>=5.9
  # reporting (self-contained report.html)
  - jinja2>=3.1
  - markupsafe>=2.1
  # dev / tests
  - pytest>=7.0
