# petrubseq-pipeline-protein -- v0.1 conda environment
#
# Create / activate:
#   conda env create -f environment.yml
#   conda activate petrubseq-protein
#   pip install -e .
#
# Deliberately lighter than weili-lab/perturbseq-pipeline: v0.1 is a
# processing pipeline (load / align / QC / normalize / embed / summarize),
# so no leiden/igraph, statsmodels, seaborn, harmony, or GPU stacks (jinja2 only for report.html).
# Add packages here only when a v0.x stage needs them.
name: petrubseq-protein
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pip
  # core numerics
  - numpy>=1.26
  - pandas>=2.0
  - scipy>=1.10
  - scikit-learn>=1.3
  # single-cell stack
  - scanpy>=1.10
  - anndata>=0.10
  - h5py>=3.8
  - umap-learn>=0.5
  # plotting
  - matplotlib>=3.7
  # config / utilities
  - pyyaml>=6.0
  - tqdm>=4.60
  - psutil>=5.9
  # reporting (self-contained report.html)
  - jinja2>=3.1
  - markupsafe>=2.1
  # dev / tests
  - pytest>=7.0
